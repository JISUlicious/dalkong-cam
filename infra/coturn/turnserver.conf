# coturn configuration for dalkong-cam.
#
# Per-deployment values (realm, server-name, static-auth-secret, external-ip)
# are passed via command-line flags from docker-compose.yml so the operator
# only needs to edit infra/.env to change deployments. coturn does not support
# environment-variable interpolation inside this file.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret

# Restrict relay addresses to public interface(s). coturn auto-detects on
# most single-NIC VPSes; uncomment and set `external-ip` if it picks the
# wrong address (e.g. AWS EC2 with separate private/public IPs).
# external-ip=203.0.113.10/10.0.0.5

# TLS certificates for TURNS (port 5349). Optional for v1 — TURN over plain
# UDP/TCP on 3478 works on virtually every home network.
# cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.crt
# pkey=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${DOMAIN}/${DOMAIN}.key

# Disable insecure features.
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers

# Quotas to limit abuse.
total-quota=200
user-quota=20
max-bps=1500000

# Log to stdout for container friendliness.
log-file=stdout
