# coturn configuration for dalkong-cam
# Replace `your.domain` and the secret before deploying.

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SHARED_SECRET

realm=your.domain
server-name=turn.your.domain

# Restrict relay addresses to public interface(s); set the right external-ip for your VPS.
# external-ip=203.0.113.10/10.0.0.5

# TLS certificates (issued by Caddy or certbot for turn.your.domain).
# cert=/etc/letsencrypt/live/turn.your.domain/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.your.domain/privkey.pem

# Disable insecure features.
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-loopback-peers

# Quotas to limit abuse.
total-quota=200
user-quota=20
max-bps=1500000

# Log to stdout for container friendliness.
log-file=stdout
