# Example nginx server block for dalkong-cam.
#
# Drop into your nginx sites-available, replace `cam.yourdomain.com` with
# your actual subdomain, point the ssl_certificate paths at your existing
# cert (or run `certbot --nginx -d cam.yourdomain.com` to issue a fresh
# one), enable with `nginx -t && nginx -s reload`.
#
# Assumes the dalkong-cam compose stack is up with docker-compose.nginx.yml
# applied — i.e. api on 127.0.0.1:3001, minio on 127.0.0.1:9000.

# WebSocket upgrade map. Keep at http context (top of nginx.conf or a
# /etc/nginx/conf.d/websocket.conf) — nginx complains if it appears
# inside a server block.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 443 ssl;
    http2 on;
    server_name cam.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/cam.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.yourdomain.com/privkey.pem;

    # Hardening (mirror of what Caddy provided)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 100m;   # generous cap for video uploads via /media

    # WebSocket signaling
    location = /signaling {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # MinIO (recorded videos). Strip the /media prefix.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow ranged requests for video seeking.
        proxy_buffering off;
    }

    # API + auth + devices + videos + health
    location ~ ^/(auth|api|devices|videos|health)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Anything else returns a polite 404.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name cam.yourdomain.com;
    return 301 https://$host$request_uri;
}
