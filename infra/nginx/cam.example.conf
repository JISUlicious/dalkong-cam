# Example nginx server block for dalkong-cam.
#
# Drop into your nginx sites-available, replace `cam.yourdomain.com` with
# your actual subdomain, point the ssl_certificate paths at your existing
# cert (or run `certbot --nginx -d cam.yourdomain.com` to issue a fresh
# one), enable with `nginx -t && nginx -s reload`.
#
# Pick the right upstream form for where nginx itself runs:
#
#   - nginx on the host machine:
#       proxy_pass http://127.0.0.1:3001;        # api
#       proxy_pass http://127.0.0.1:9000;        # minio
#     The dalkong-cam stack already binds these on 127.0.0.1.
#
#   - nginx in Docker on Docker Desktop (Mac/Windows):
#       proxy_pass http://host.docker.internal:3001;
#       proxy_pass http://host.docker.internal:9000;
#     On Linux, add `extra_hosts: ["host.docker.internal:host-gateway"]`
#     to the nginx service.
#
#   - nginx in Docker on a shared `proxy` network (recommended for
#     Docker-Docker setups):
#       proxy_pass http://api:3001;              # api container
#       proxy_pass http://minio:9000;            # minio container
#     Requires:
#       1. `docker network create proxy` on the host.
#       2. The dalkong-cam stack started with `docker-compose.nginx.yml`
#          (which attaches api + minio to the `proxy` network).
#       3. The nginx Compose service attached to the same external
#          `proxy` network.
#
# The active example below uses the shared-network form. Swap in the
# matching `proxy_pass` URL if you're using a different layout.

# /signaling only serves WebSocket traffic, so we set Connection to a
# literal "upgrade" — no map at http context required. If you'd rather
# use the canonical $connection_upgrade variable form (so other vhosts
# can share it), drop this map into /etc/nginx/conf.d/websocket.conf:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 443 ssl;
    http2 on;
    server_name cam.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/cam.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cam.yourdomain.com/privkey.pem;

    # Hardening (mirror of what Caddy provided)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 100m;   # generous cap for video uploads via /media

    # WebSocket signaling
    location = /signaling {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # MinIO (recorded videos). Strip the /media prefix.
    location /media/ {
        rewrite ^/media/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow ranged requests for video seeking.
        proxy_buffering off;
    }

    # API + auth + devices + videos + health
    location ~ ^/(auth|api|devices|videos|health)(/|$) {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Anything else returns a polite 404.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name cam.yourdomain.com;
    return 301 https://$host$request_uri;
}
