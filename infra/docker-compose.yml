services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalkong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: dalkong
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalkong"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?missing}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?missing}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/caddy-data:ro
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${DOMAIN:?missing}"
      - "--server-name=${DOMAIN:?missing}"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?missing}"

  # Local SMTP catcher for testing the email-verification flow without a
  # real SMTP provider. Web UI on http://localhost:8025. Opt in with:
  #   docker compose --profile dev up -d
  # Then point apps/api/.env SMTP_URL=smtp://mailpit:1025 (no auth).
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
    expose:
      - "1025"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?missing}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?missing}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - minio

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
